<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รายงานการบริหารอาคาร · สำนักงานงบประมาณ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --navy:#14254A;--navy-2:#1F3767;--gold:#C9A227;--bronze:#A8733F;--gold-soft:#F3E7BF;
  --bg:#EEF0F4;--surface:#FFFFFF;--surface-2:#F6F7FA;--line:#D9DDE5;--ink:#1A2233;--ink-2:#55607A;
  --ok:#1E8E4F;--ok-bg:#E3F4EA;--warn:#B98900;--warn-bg:#FCF2CF;--wait:#6B7486;--wait-bg:#E8EAEF;--danger:#B3261E;
  --c1:#14254A;--c2:#C9A227;--c3:#1E8E4F;--c4:#7A8394;--grid:#E3E6EC;
  --fh:"Kanit","Sarabun",system-ui,sans-serif;--fb:"Sarabun","Leelawadee UI","Tahoma",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1526;--surface:#172036;--surface-2:#1D2842;--line:#2C3A5A;--ink:#E8ECF4;--ink-2:#A3AEC6;--gold-soft:#3A3218;
  --ok-bg:#163826;--warn-bg:#3A3112;--wait-bg:#283148;--ok:#4CC27F;--warn:#E3B23C;--wait:#A3AEC6;--c1:#8FA8DA;--c3:#4CC27F;--c4:#A3AEC6;--grid:#2C3A5A}}
:root[data-theme="dark"]{
  --bg:#0E1526;--surface:#172036;--surface-2:#1D2842;--line:#2C3A5A;--ink:#E8ECF4;--ink-2:#A3AEC6;--gold-soft:#3A3218;
  --ok-bg:#163826;--warn-bg:#3A3112;--wait-bg:#283148;--ok:#4CC27F;--warn:#E3B23C;--wait:#A3AEC6;--c1:#8FA8DA;--c3:#4CC27F;--c4:#A3AEC6;--grid:#2C3A5A}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--fh);font-weight:600;line-height:1.3;margin:0}

.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1080px;margin:0 auto;padding:10px 18px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 20px}
.brand{flex:1 1 280px;display:flex;align-items:center;gap:12px;padding-bottom:10px;min-width:0}
.brand img{height:42px;width:auto;background:#fff;border-radius:6px;padding:3px 6px}
.brand b{font-family:var(--fh);font-weight:600;font-size:20px;display:block;line-height:1.2}
.brand small{font-size:14px;opacity:.85}
.mode{font-size:12px;padding:1px 9px;border-radius:99px;background:rgba(255,255,255,.14);margin-left:6px;vertical-align:middle;font-weight:500;font-family:var(--fb)}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tab{background:transparent;border:0;color:#C9D2E6;padding:9px 14px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:600;white-space:nowrap;font-size:16px}
.tab[aria-selected="true"]{background:var(--gold);color:var(--navy)}
.tab.admin{color:var(--gold)}
main{max-width:1080px;margin:0 auto;padding:20px 16px 120px}
.banner{background:var(--warn-bg);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:15px}
.rowbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.rowbar h1{font-size:24px;margin-right:auto}
.sub{color:var(--ink-2);font-size:15px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.card h3{margin:0 0 12px;font-size:18px;border-left:6px solid var(--gold);padding-left:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi span{display:block;font-size:14px;color:var(--ink-2)}
.kpi b{font-family:var(--fh);font-weight:600;font-size:30px;line-height:1.25;color:var(--navy-2)}
:root[data-theme="dark"] .kpi b{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi b{color:var(--gold)}}
.kpi b small{font-size:15px;font-family:var(--fb);color:var(--ink-2);font-weight:500;margin-left:4px}
.kpi em{font-style:normal;font-size:13px;color:var(--ink-2);display:block}
/* dashboard tiles in theme colours (web only; PDF keeps plain tiles) */
:root{--k1:#14254A;--k2:#1F3767;--k3:#C9A227;--k4:#2E4A7D;--k5:#8A5A2B}
#app .kpi{border:0;border-bottom:4px solid var(--gold);color:#fff;padding:14px 16px 12px}
#app .kpi span{color:rgba(255,255,255,.88);font-weight:600}
#app .kpi b{color:#fff;font-size:34px}
#app .kpi b small,#app .kpi em{color:rgba(255,255,255,.82)}
#app .kpi:nth-child(5n+1){background:var(--k1)}
#app .kpi:nth-child(5n+2){background:var(--k2)}
#app .kpi:nth-child(5n+3){background:var(--k3);border-bottom-color:var(--navy);color:var(--navy)}
#app .kpi:nth-child(5n+3) span,#app .kpi:nth-child(5n+3) b,#app .kpi:nth-child(5n+3) b small,#app .kpi:nth-child(5n+3) em{color:#14254A}
#app .kpi:nth-child(5n+4){background:var(--k4)}
#app .kpi:nth-child(5n+5){background:var(--k5)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chart h3{font-size:16px;margin:0}
.chart .sub{font-size:13px;margin-bottom:6px}
.chart svg{width:100%;height:auto;display:block;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink-2);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.issues{margin:0;padding-left:20px}
.issues li{margin:4px 0}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{text-align:center;font-size:13px;color:var(--ink-2);font-weight:600}
.cday{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:64px;padding:6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.cday:disabled{cursor:default;opacity:.55}
.cday.out{visibility:hidden}
.cday.today{border-color:var(--gold);border-width:2px}
.cday b{font-size:15px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{font-size:11px;font-weight:700;border-radius:6px;padding:0 5px}
.dot.ok{background:var(--ok-bg);color:var(--ok)}.dot.miss{background:transparent;color:var(--ink-2);border:1px dashed var(--line)}
.backfill{background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:15px}
.datenav{display:flex;gap:6px;align-items:flex-end}.datenav .inp{flex:1}
.tag{display:inline-block;font-size:13px;font-weight:600;border-radius:6px;padding:0 8px;background:var(--gold-soft);color:var(--ink);margin-left:6px}.dot.warn{background:var(--warn-bg);color:var(--warn)}
@media (max-width:560px){.cday{min-height:52px;padding:4px}.cday b{font-size:13px}.dot{font-size:10px;padding:0 3px}}

/* edit */
.meta{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2);font-weight:600}
.inp{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:17px;color:var(--ink);width:100%}
.meta .note{grid-column:1/-1}
.existing{grid-column:1/-1;font-size:14px;color:var(--ink-2)}
textarea.big{min-height:100px;resize:vertical;font-size:18px;line-height:1.5}
.seg{display:flex;gap:4px;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;padding:9px 12px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--ink-2);white-space:nowrap;font-size:15px}
.seg button[aria-selected="true"]{background:var(--navy);color:#fff}
.seg em{font-style:normal;font-size:12px;background:var(--gold);color:var(--navy);border-radius:99px;padding:0 7px;margin-left:5px}
.eq{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.sec-h{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-left:8px solid var(--gold);padding:10px 14px;border-radius:10px;margin-top:18px}
.sec-h h2{font-size:19px;flex:1}
.sec-h small{font-size:14px;opacity:.8;font-family:var(--fb);font-weight:500}
.count{background:var(--gold);color:var(--navy);font-weight:700;border-radius:99px;min-width:30px;text-align:center;padding:0 8px;font-size:15px}
.items{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 14px;display:grid;grid-template-columns:30px 1fr;gap:6px 10px}
.num{font-family:var(--fh);font-weight:600;color:var(--gold);font-size:20px;line-height:1.6}
.item textarea{min-height:64px;resize:vertical;font-size:18px;line-height:1.5}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface-2);border-radius:99px;padding:5px 12px;font-size:15px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.chip.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.warn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.chip.wait[aria-pressed="true"]{background:var(--wait);border-color:var(--wait);color:#fff}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.del{color:var(--danger)}
.add{margin-top:10px;width:100%;border:2px dashed var(--line);background:transparent;border-radius:12px;padding:10px;cursor:pointer;color:var(--ink-2);font-weight:600}
.add:hover{border-color:var(--gold);color:var(--ink)}
.media{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:96px;height:96px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--ink-2);padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:14px;line-height:24px;padding:0}
.file-a{color:inherit;text-decoration:none;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;word-break:break-all}
.file-a b{font-size:22px}
.prog-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}
.prog{height:10px;background:var(--wait-bg);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok)}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
.slot-h{background:var(--navy);color:#fff;padding:8px 14px;font-family:var(--fh);font-weight:600;font-size:17px;display:flex;gap:10px;align-items:center;border-left:8px solid var(--gold)}
.slot-h span{flex:1}
.slot-h small{font-family:var(--fb);font-size:14px;opacity:.85;font-weight:500}
.rrow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 14px;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.rrow.is-ok{background:color-mix(in srgb,var(--ok-bg) 55%,transparent)}
.rrow.is-issue{background:color-mix(in srgb,var(--warn-bg) 70%,transparent)}
.rtext{font-size:17px;line-height:1.45}
.fl{display:inline-block;font-size:13px;color:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;font-weight:600;white-space:nowrap}
.rctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rmore{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rmore .inp{flex:1 1 220px;padding:6px 10px;font-size:15px}
.rmore .rtime{flex:0 0 120px}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 -6px 20px rgba(20,37,74,.08)}
.savebar-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.state{font-size:14px;color:var(--ink-2);margin-right:auto}
.state.dirty{color:var(--warn);font-weight:600}

/* view */
.vitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:30px 1fr;gap:6px 10px}
.vtext{font-size:18px;white-space:pre-wrap}
.badge{display:inline-block;font-weight:700;border-radius:8px;padding:2px 12px;font-size:15px}
.badge.ok{background:var(--ok);color:#fff}.badge.warn{background:var(--warn);color:#fff}.badge.wait{background:var(--wait);color:#fff}
.vhead{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:12px;padding:14px 16px}
.vhead h2{font-size:22px}
.vhead div{color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:17px;margin:0}
.kv dt{color:var(--ink-2);font-weight:600}.kv dd{margin:0;white-space:pre-wrap}
.shifttabs{display:flex;gap:6px;margin:12px 0}
.empty{text-align:center;padding:40px 16px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}

.lb{position:fixed;inset:0;background:rgba(5,10,22,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex}
.lb img{max-height:100%;max-width:100%;object-fit:contain;border-radius:6px}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;border-bottom:3px solid var(--gold);max-width:90vw}
.toast.on{opacity:1}
.busy{position:fixed;inset:0;background:var(--bg);z-index:65;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:18px;font-weight:600;color:var(--ink)}
.busy.on{display:flex}
.thumb.broken{font-size:12px;padding:6px}
.modal{position:fixed;inset:0;background:rgba(5,10,22,.6);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--surface);color:var(--ink);border-radius:14px;padding:20px;width:min(380px,100%);border-top:5px solid var(--gold);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h2{font-size:20px;margin-bottom:6px}
.modal .pin{font-size:28px;letter-spacing:.4em;text-align:center;font-family:var(--fh)}
.modal .err{color:var(--danger);font-size:14px;min-height:20px;margin-top:6px}
.adminbtn{border-color:var(--gold)}
.contract{margin-top:0;margin-bottom:16px;border-top:4px solid var(--navy)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px;margin-top:10px}
.cgrid span{display:block;font-size:13px;color:var(--ink-2);font-weight:600}
.cgrid b{font-family:var(--fh);font-size:22px}
.cgrid b small{font-family:var(--fb);font-size:14px;color:var(--ink-2);font-weight:500}
details.imp{background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:12px 16px;margin-top:14px}
details.imp summary{cursor:pointer;font-weight:700;font-family:var(--fh);font-size:17px}
details.imp[open] summary{margin-bottom:8px}
.pk{width:100%;border-collapse:collapse;font-size:16px}
.pk th,.pk td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left}
.pk th{color:var(--ink-2);font-size:14px;font-weight:600}
.pk td.n,.pk th.n{text-align:right;white-space:nowrap}
.pk input{width:100%;min-width:56px;padding:6px 8px;font-size:17px;color:var(--ink)}
.pk td:first-child input{max-width:120px}
.pk input.qty{text-align:right;max-width:110px}
.pk tfoot td{font-weight:700;font-family:var(--fh);font-size:17px;border-bottom:0;border-top:2px solid var(--gold)}
.pkbig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.pkbig div{background:var(--surface-2);border-radius:10px;padding:8px 12px}
.pkbig span{display:block;font-size:13px;color:var(--ink-2)}
.pkbig b{font-family:var(--fh);font-size:26px;color:var(--navy-2)}
:root[data-theme="dark"] .pkbig b{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pkbig b{color:var(--gold)}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:560px){.thumb{width:84px;height:84px}.rrow{grid-template-columns:1fr}.rctl{justify-content:flex-start}.brand img{height:34px}}

/* ===== PDF stage: A4 template (fixed light palette) ===== */
#stage{--grid:#E3E6EC;position:absolute;left:0;top:0;z-index:-1;font-family:var(--fb);color:#1A2233;background:#fff;line-height:1.5}
#stage .pg{background:#fff;padding:0 57px;width:794px}
#stage .pg.land{width:1123px}
#stage .hd{display:flex;align-items:center;gap:16px;height:70px;padding:36px 0 10px;box-sizing:content-box}
#stage .hd img{height:70px;width:auto}
#stage .hd .co{flex:1;min-width:0}
#stage .hd .cth{font-family:var(--fh);font-weight:600;font-size:20px;line-height:1.2;color:#14254A}
#stage .hd .cen{font-family:var(--fh);font-weight:500;font-size:14px;letter-spacing:.06em;color:#A8733F}
#stage .hd .cw{font-size:12px;color:#5A6378}
#stage .doct{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:8px 0 2px}
#stage .doct .t1{font-family:var(--fh);font-weight:600;font-size:21px;line-height:1.25;color:#14254A}
#stage .doct .t2{font-size:14px;color:#1A2233;text-align:right}
#stage .hd .vr{width:1px;align-self:stretch;background:#D5D9E1}
#stage .hd .tt{flex:1;min-width:0}
#stage .hd .t1{font-family:var(--fh);font-weight:600;font-size:22px;line-height:1.2;color:#14254A}
#stage .hd .t2{font-size:15px;font-weight:500}
#stage .hd .t3{font-size:13px;color:#5A6378}
#stage .hd .mb{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:13px;padding:8px 12px;border:1px solid #C9CED8;border-radius:4px}
#stage .hd .mb span:nth-child(odd){color:#5A6378}
#stage .hd .mb span:nth-child(even){font-weight:600}
#stage .rule1{height:3px;background:#14254A}#stage .rule2{height:1px;background:#A8733F;margin-top:3px}
#stage .rule1,#stage .rule2,#stage .hd,#stage .doct,#stage .ft{flex-shrink:0}
#stage .ft{border-top:1px solid #C9CED8;padding:10px 0 40px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;font-size:12px;color:#5A6378}
#stage .ft b{color:#1A2233;display:block}
#stage .ft .pn{background:#14254A;color:#fff;font-weight:600;padding:3px 10px;border-radius:3px;white-space:nowrap;margin-left:12px}
#stage .bk{padding:0 57px;width:794px;background:#fff}
#stage .bar{background:#14254A;color:#fff;padding:5px 12px;border-radius:3px;font-family:var(--fh);font-weight:500;font-size:16px;display:flex;justify-content:space-between;margin-top:10px}
#stage .bar span{font-family:var(--fb);font-size:13px;color:#DCE2EE}
#stage table{width:100%;border-collapse:collapse;margin-top:6px}
#stage th{border:1px solid #C9CED8;padding:4px 8px;background:#EEF1F6;color:#14254A;font-weight:600;font-size:13px;text-align:left}
#stage td{border:1px solid #C9CED8;padding:3px 8px;font-size:14px;vertical-align:top}
#stage td.c{text-align:center;white-space:nowrap}
#stage .tok{color:#1E8E4F;font-weight:700}#stage .tis{color:#B98900;font-weight:700}#stage .tno{color:#8A93A3}
#stage .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px;font-size:15px;padding:12px 0 4px;background:none;border:0}
#stage .meta b{color:#14254A}
#stage .txt{font-size:16px;white-space:pre-wrap;padding:4px 2px}
#stage .it{display:flex;gap:14px;padding:8px 0;border-bottom:1px solid #E3E6EC}
#stage .it .n{font-family:var(--fh);font-weight:600;color:#A8733F;font-size:18px;width:22px}
#stage .it .t{flex:1;font-size:16px;white-space:pre-wrap}
#stage .it .st{display:inline-block;margin-top:4px;font-weight:700;font-size:14px;padding:1px 12px;border-radius:4px;color:#fff}
#stage .it .st.ok{background:#1E8E4F}#stage .it .st.warn{background:#B98900}#stage .it .st.wait{background:#6B7486}
#stage .it .im{width:260px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
#stage .it .im.one{grid-template-columns:1fr}
#stage .it .im img{width:100%;height:120px;object-fit:cover;border-radius:4px;border:1px solid #D5D9E1}
#stage .it .im.one img{height:170px}
#stage .rimg{display:flex;gap:4px;margin-top:3px}#stage .rimg img{width:64px;height:48px;object-fit:cover;border-radius:3px}
#stage .sig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;font-size:13px;color:#5A6378;text-align:center;padding-top:28px}
#stage .sig div{border-top:1px dotted #5A6378;padding-top:4px}
#stage .sig b{display:block;color:#1A2233;font-size:14px}
#stage .wk{padding:0 57px;width:1123px;height:794px;background:#fff;display:flex;flex-direction:column}
#stage .wk .kpis{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
#stage .wk .kpi{border:1px solid #C9CED8;border-radius:4px;padding:6px 12px;background:#fff}
#stage .wk .kpi span{color:#5A6378;font-size:13px}
#stage .wk .kpi b{color:#14254A;font-size:24px}
#stage .wk .kpi b small{color:#5A6378}
#stage .wk .kpi em{color:#5A6378;font-size:12px;display:block}
#stage .wk .charts{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 12px;flex:1}
#stage .wk .chart{border:1px solid #C9CED8;border-radius:4px;padding:6px 10px;background:#fff;color:#1A2233}
#stage .wk .chart h3{font-size:14px;color:#1A2233}
#stage .wk .chart svg{color:#5A6378;height:128px}
#stage .wk .legend{color:#5A6378;font-size:11px}
#stage .wk .ft{margin-top:auto}
</style>
</head>

/* ---------- media ---------- */
function compress(file){return new Promise(res=>{
  if(!/^image\/(jpeg|png|webp|heic|heif)/.test(file.type)){res(file);return}
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    c.toBlob(b=>res(b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}):file),"image/jpeg",.82)};
  img.onerror=()=>{URL.revokeObjectURL(url);res(file)};img.src=url})}
const kindOf=t=>t.startsWith("image/")?"image":t.startsWith("video/")?"video":"pdf";
function toDataURL(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
async function addFiles(files,h){
  const it=holder(h,true);if(!it)return;
  if(h[0]==="r"&&!it.status){it.status="ok";it.time=it.time||autoTime(h.slice(2))}
  for(const raw of files){
    if(!/^(image\/|video\/(mp4|webm)|application\/pdf)/.test(raw.type)){toast("รองรับเฉพาะภาพ วิดีโอ MP4 และ PDF");continue}
    const f=await compress(raw);if(f.size>20*1024*1024){toast(raw.name+" ใหญ่เกิน 20 MB");continue}
    const tmp={tmp:uid(),kind:kindOf(f.type),name:raw.name,takenAt:raw.lastModified||null};it.media=it.media||[];it.media.push(tmp);uploads++;setDirty(true);render();
    try{
      if(mode==="cloud"&&tmp.kind==="image"){
        const di=await toDbImage(raw),iid="i"+uid();await db.doc("images/"+iid).set({data:di.data,w:di.w,h:di.h,name:raw.name,at:Date.now()});
        imgCache[iid]=di.data;tmp.img=iid;
        if(assets)assets.upload(f,{type:f.type}).then(r=>{tmp.id=r.id;learnBase(r.id,r.url)}).catch(()=>{}); /* full-size copy kept as archive */
      }else if(mode==="cloud"){if(!assets)throw{code:"no_assets"};const r=await assets.upload(f,{type:f.type});tmp.id=r.id;learnBase(r.id,r.url)}
      else tmp.src=await toDataURL(f);
      delete tmp.tmp}
    catch(e){it.media=it.media.filter(m=>m!==tmp);toast(e&&e.code==="quota_exceeded"?"พื้นที่เก็บข้อมูลเต็ม":e&&e.code==="no_assets"?"แนบวิดีโอ/PDF ได้เฉพาะสิทธิ์ Editor":"อัปโหลด "+raw.name+" ไม่สำเร็จ ("+(e&&(e.code||e.message)||"")+")")}
    uploads--;render();
  }
}

function weekData(start){
  const days=[...Array(7)].map((_,i)=>addDays(start,i));
  const W={days,roundPct:{day:[],night:[]},issuesBySys:{},cmOpen:[],cmClosed:[],pm:{done:[],doing:[],wait:[]},service:[],cleaning:[],parking:[],parkCar:[],parkMoto:[],parkNights:0,plates:{},issues:[],tot:{rOk:0,rTot:0,cmO:0,cmC:0,pmDone:0,pmTot:0,svc:0,cln:0,park:0,reports:0}};
  days.forEach(d=>{
    let cmO=0,cmC=0,pmd=0,pmg=0,pmw=0,svc=0,cln=0,park=0,pc=0,pmo=0,hasNight=false;
    ["day","night"].forEach(sh=>{
      const r=getR(rid(d,sh));
      if(!r){W.roundPct[sh].push(null);return}
      W.tot.reports++;
      const s=roundStats(r);W.roundPct[sh].push(s.total?Math.round(s.done*100/s.total):null);W.tot.rOk+=s.done;W.tot.rTot+=s.total;
      roundItems(sh).forEach(i=>{const x=r.rounds[i.id];if(x&&x.status==="issue"){const k=systemOf(i.text);W.issuesBySys[k]=(W.issuesBySys[k]||0)+1;W.issues.push(`${thShort(d)} ${sh==="day"?"M":"AN"}: ${i.text}${x.note?" ("+x.note+")":""}`)}});
      r.sections.cm.forEach(it=>{cmO++;if(it.status==="done")cmC++;else W.issues.push(`${thShort(d)} งาน CM ยังไม่ปิด: ${(it.text||"").split("\n")[0]}`)});
      r.sections.pm.forEach(it=>{if(it.status==="done")pmd++;else if(it.status==="doing")pmg++;else pmw++});
      svc+=r.sections.service.length;cln+=r.sections.cleaning.length;
      if(hasPk(r)){const S=pkSum(r);pc+=S.car;pmo+=S.moto;park+=S.total;hasNight=true}
      r.sections.parking.forEach(it=>{park++;if(!hasPk(r))pc++;const p=(it.plate||"").replace(/\s+/g,"").toUpperCase();if(p){W.plates[p]=W.plates[p]||new Set();W.plates[p].add(d)}});
    });
    W.cmOpen.push(cmO);W.cmClosed.push(cmC);W.pm.done.push(pmd);W.pm.doing.push(pmg);W.pm.wait.push(pmw);W.service.push(svc);W.cleaning.push(cln);W.parking.push(park);W.parkCar.push(pc);W.parkMoto.push(pmo);if(hasNight||park)W.parkNights++;
    W.tot.cmO+=cmO;W.tot.cmC+=cmC;W.tot.pmDone+=pmd;W.tot.pmTot+=pmd+pmg+pmw;W.tot.svc+=svc;W.tot.cln+=cln;W.tot.park+=park;
  });
  W.repeat=Object.entries(W.plates).filter(([,s])=>s.size>=2).map(([p,s])=>`${p} (${s.size} คืน)`);
  return W;
}

const COL=["var(--c1)","var(--c2)","var(--c3)","var(--c4)"];
const PCOL=["#14254A","#C9A227","#1E8E4F","#7A8394"];
function axes(labels,maxV,W,H,L,B,unit){
  let g="";const steps=4;
  for(let i=0;i<=steps;i++){const v=maxV*i/steps,y=H-B-(H-B-10)*i/steps;g+=`<line x1="${L}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--grid,#E3E6EC)" stroke-width="1"/><text x="${L-6}" y="${y+4}" font-size="11" text-anchor="end" fill="currentColor">${Math.round(v)}${unit||""}</text>`}
  const bw=(W-L-6)/labels.length;labels.forEach((t,i)=>{g+=`<text x="${L+bw*i+bw/2}" y="${H-B+16}" font-size="11" text-anchor="middle" fill="currentColor">${esc(t)}</text>`});
  return{g,bw};
}
function niceMax(v){if(v<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=[1,2,2.5,5,10].find(x=>x*p>=v);return n*p}
function lineChart(labels,series,pal,unit,fixedMax){
  const W=360,H=200,L=40,B=26;const maxV=fixedMax||niceMax(Math.max(1,...series.flatMap(s=>s.values.filter(v=>v!=null))));
  const {g,bw}=axes(labels,maxV,W,H,L,B,unit);let s="";
  series.forEach((se,si)=>{let d="";se.values.forEach((v,i)=>{if(v==null)return;const x=L+bw*i+bw/2,y=H-B-(H-B-10)*v/maxV;d+=(d&&se.values[i-1]!=null?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);s+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${pal[si]}"/>`});s=`<path d="${d}" fill="none" stroke="${pal[si]}" stroke-width="2.5"/>`+s});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${s}</svg>`;
}
function barChart(labels,series,pal,stacked){
  const W=360,H=200,L=34,B=26;const tot=labels.map((_,i)=>stacked?series.reduce((a,s)=>a+s.values[i],0):Math.max(...series.map(s=>s.values[i])));
  const maxV=niceMax(Math.max(1,...tot));const {g,bw}=axes(labels,maxV,W,H,L,B,"");let s="";
  labels.forEach((_,i)=>{let acc=0;const n=stacked?1:series.length,w=Math.min(26,(bw-8)/n);
    series.forEach((se,si)=>{const v=se.values[i];if(!v)return;const h=(H-B-10)*v/maxV;const x=stacked?L+bw*i+bw/2-w/2:L+bw*i+bw/2-(w*n)/2+w*si;const y=H-B-h-(stacked?acc:0);
      s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${pal[si]}" rx="2"/>`;if(stacked)acc+=h})});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${s}</svg>`;
}
function hbarChart(items,pal){
  const W=360,H=200;if(!items.length)return `<svg viewBox="0 0 ${W} ${H}" role="img"><text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="13" fill="currentColor">ไม่พบปัญหาในสัปดาห์นี้</text></svg>`;
  const max=Math.max(...items.map(i=>i[1])),rowH=Math.min(34,(H-10)/items.length);let s="";
  items.forEach(([k,v],i)=>{const y=6+i*rowH,w=(W-170)*v/max;s+=`<text x="128" y="${y+rowH/2+4}" font-size="12" text-anchor="end" fill="currentColor">${esc(k)}</text><rect x="136" y="${y+4}" width="${Math.max(2,w).toFixed(1)}" height="${rowH-10}" fill="${pal[0]}" rx="2"/><text x="${140+w}" y="${y+rowH/2+4}" font-size="12" fill="currentColor">${v}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${s}</svg>`;
}
const legend=(names,pal)=>`<div class="legend">${names.map((n,i)=>`<span><i style="background:${pal[i]}"></i>${n}</span>`).join("")}</div>`;

  return `<div class="charts">${C.map(c=>`<div class="chart"><h3>${c[0]}</h3><div class="sub">${esc(c[1])}</div>${c[2]}${c[3]}</div>`).join("")}</div>`;

  await savePdf(pdf,`สรุปรายสัปดาห์_${ws}.pdf`);
})}

/* ---------- in-page confirm (window.confirm is blocked inside the artifact frame) ---------- */
function ask(msg,yes="ยืนยัน",no="ยกเลิก"){return new Promise(res=>{const M=$("#askModal");$("#askMsg").textContent=msg;$("#askYes").textContent=yes;$("#askNo").textContent=no;M.classList.add("on");
  const done=v=>{M.classList.remove("on");$("#askYes").onclick=$("#askNo").onclick=null;M.onkeydown=null;res(v)};
  $("#askYes").onclick=()=>done(true);$("#askNo").onclick=()=>done(false);M.onkeydown=e=>{if(e.key==="Escape")done(false)};setTimeout(()=>$("#askYes").focus(),30)})}
/* ---------- events ---------- */
async function confirmLeave(){return !dirty||await ask("มีการแก้ไขที่ยังไม่บันทึก ต้องการทิ้งการแก้ไขหรือไม่?","ทิ้งการแก้ไข","กลับไปแก้ต่อ")}
$("#tabs").addEventListener("click",async e=>{const b=e.target.closest("[data-tab]");if(!b)return;if(view==="edit"&&b.dataset.tab!=="edit"&&dirty&&!await ask("มีการแก้ไขที่ยังไม่บันทึก ออกจากหน้านี้หรือไม่?\n(ข้อมูลที่กรอกยังอยู่จนกว่าจะเปลี่ยนวันหรือกะ)","ออกจากหน้านี้","อยู่ต่อ"))return;view=b.dataset.tab;render();window.scrollTo(0,0)});
$("#bSave").onclick=saveReport;

$("#bPdf").onclick=()=>pdfDaily(draft);
$("#lbX").onclick=()=>$("#lb").classList.remove("on");

document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#lb").classList.remove("on")});
app.addEventListener("input",e=>{
  {const t=e.target;if(t.dataset.pk){draft.parkingCount[t.dataset.pk]=t.value;setDirty(true);return}
   if(t.dataset.pkf){const x=draft.parkingCount.rows[+t.dataset.i];x[t.dataset.pkf]=t.dataset.pkf==="floor"?t.value.toUpperCase():t.value.replace(/[^0-9]/g,"");pkWarn="";setDirty(true);if(t.dataset.pkf!=="floor")pkUpdateTotals();return}}
  const t=e.target,hb=t.closest("[data-h]");
  if(t.id==="mRep"){draft.reporter=t.value;setDirty(true);return}
  if(t.id==="mNote"){draft.note=t.value;setDirty(true);return}
  if(t.dataset.hf){draft.handover[t.dataset.hf]=t.value;setDirty(true);return}
  if(!hb)return;const it=holder(hb.dataset.h,true);const a=t.dataset.act;
  if(a==="text")it.text=t.value;else if(a==="rtime")it.time=t.value;else if(a==="rnote")it.note=t.value;else if(a==="plate")it.plate=t.value;else if(a==="loc")it.loc=t.value;else return;
  setDirty(true);
});
app.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="mDate"||t.id==="mShift"){let nd=$("#mDate").value||today();if(nd<PROJECT.start||nd>PROJECT.end){toast("เลือกได้เฉพาะวันที่ในระยะสัญญา 1 ต.ค. 2569 – 30 ก.ย. 2570");nd=nd<PROJECT.start?PROJECT.start:lastDay();$("#mDate").value=nd}const ns=$("#mShift").value;if(nd>today()){toast("บันทึกล่วงหน้าไม่ได้ เลือกวันนี้หรือวันที่ผ่านมา");nd=today();$("#mDate").value=nd}
    if(!await confirmLeave()){t.value=t.id==="mDate"?draft.date:draft.shift;return}loadDraft(nd,ns);renderEdit()}});
app.addEventListener("click",async e=>{
  const z=e.target.closest("[data-zoom]");if(z){$("#lbImg").src=z.currentSrc||z.src;$("#lb").classList.add("on");return}
  const o=e.target.closest("[data-open]");if(o){const [d,s]=o.dataset.open.split("|");dayView=d;dayShift=s;view="day";render();window.scrollTo(0,0);return}
  const dy=e.target.closest("[data-day]");if(dy){dayView=dy.dataset.day;view="day";render();window.scrollTo(0,0);return}
  const sh=e.target.closest("[data-shift]");if(sh){dayShift=sh.dataset.shift;renderDay();return}
  const p=e.target.closest("[data-pane]");if(p){pane=p.dataset.pane;renderEdit();return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,hb=b.closest("[data-h]"),h=hb?hb.dataset.h:null;
  switch(act){
    case "dprev":case "dnext":case "dtoday":{const nd=act==="dtoday"?today():addDays(draft.date,act==="dprev"?-1:1);if(nd>today()||!inProject(nd)||!await confirmLeave())break;loadDraft(nd,draft.shift);renderEdit();break}
    case "lineImport":await lineImport(($("#lineImport")||{}).value);break;
    case "pkImport":pkImport(($("#pkPaste")||{}).value);break;
    case "pkAdd":draft.parkingCount.rows.push({floor:"",car:"",moto:""});setDirty(true);renderEdit();{const ins=app.querySelectorAll('[data-pkf="floor"]');if(ins.length)ins[ins.length-1].focus()}break;
    case "pkDel":{const i=+b.dataset.i,x=draft.parkingCount.rows[i];if((num(x.car)||num(x.moto))&&!await ask(`ลบชั้น ${x.floor}?`,"ลบ"))break;draft.parkingCount.rows.splice(i,1);setDirty(true);renderEdit();break}
    case "pkLine":if(!hasPk(draft)){toast("ยังไม่มีข้อมูลรถจอดค้างคืน");break}copyText(pkText(draft));break;
    case "adminLogin":openPin("login");break;
    case "adminLogout":if(view==="edit"&&!await confirmLeave())break;if(view==="edit"){loadDraft(draft.date,draft.shift)}clientView=true;view="overview";setMode();render();toast("กลับสู่หน้าลูกค้าแล้ว");break;
    case "add":{const k=b.dataset.s;draft.sections[k].push({id:uid(),text:"",status:defaultStatus(k),media:[]});setDirty(true);renderEdit();
      const boxes=app.querySelectorAll(`.item[data-h^="s:${k}:"] ${k==="parking"?"input":"textarea"}`);if(boxes.length)boxes[k==="parking"?boxes.length-2:boxes.length-1].focus();break}
    case "st":{const it=holder(h);it.status=it.status===b.dataset.v?"":b.dataset.v;setDirty(true);renderEdit();break}
    case "rst":{const it=holder(h,true);if(it.status===b.dataset.v)it.status="";else{it.status=b.dataset.v;if(!it.time)it.time=autoTime(h.slice(2))}setDirty(true);renderEdit();break}
    case "eq":{const E=draft.handover.equip,k=b.dataset.k;E[k]=E[k]===b.dataset.v?"":b.dataset.v;setDirty(true);renderEdit();break}
    case "eqall":EQUIP.forEach((x,i)=>draft.handover.equip[i]="ok");setDirty(true);renderEdit();break;
    case "rm":{const it=holder(h),sk=h.split(":")[1];if((it.text||it.plate||(it.media||[]).length)&&!await ask("ลบรายการนี้?","ลบ"))break;
      (it.media||[]).forEach(m=>{if(m.id)pendingDelete.push(m.id);if(m.img)pendingDelete.push("img:"+m.img)});draft.sections[sk]=draft.sections[sk].filter(x=>x!==it);setDirty(true);renderEdit();break}
    case "rmm":{const it=holder(h),m=it.media[+b.dataset.m];if(m.id)pendingDelete.push(m.id);if(m.img)pendingDelete.push("img:"+m.img);it.media.splice(+b.dataset.m,1);setDirty(true);renderEdit();break}
    case "att":uploadTarget=h;$("#picker").value="";$("#picker").click();break;
    case "mprev":case "mnext":{const d=new Date(calMonth+"-01T00:00:00");d.setMonth(d.getMonth()+(act==="mprev"?-1:1));const m=iso(d).slice(0,7);if(m<PROJECT.start.slice(0,7)||m>PROJECT.end.slice(0,7))break;calMonth=m;renderHistory();break}
    case "csvMonth":exportCsv(calMonth+"-01",addDays(iso(new Date(+calMonth.slice(0,4),+calMonth.slice(5,7),1)),-1),`ข้อมูลรายงาน_${calMonth}`);break;
    case "csvAll":exportCsv(PROJECT.start,PROJECT.end,"ข้อมูลรายงาน_ทั้งสัญญา_2569-2570");break;
    case "wprev":weekStart=addDays(weekStart,-7);renderWeekly();break;
    case "wnext":weekStart=addDays(weekStart,7);renderWeekly();break;
    case "wpdf":pdfWeekly(weekStart);break;
    case "back":calMonth=dayView.slice(0,7);view="history";render();break;
    case "vline":copyText(lineText(reports[rid(dayView,dayShift)]));break;
    case "vpdf":pdfDaily(reports[rid(dayView,dayShift)]);break;
    case "vedit":if(!await confirmLeave())break;loadDraft(dayView,dayShift);view="edit";pane="handover";render();window.scrollTo(0,0);break;
    case "vdel":deleteReport(rid(dayView,dayShift));break;
  }
});

/* ---------- boot ---------- */
function setMode(){$("#mode").textContent=(mode==="cloud"?"":"ทดลอง · ")+(isAdmin()?"แอดมิน":"สำหรับลูกค้า")}
/* ---------- admin PIN ---------- */
const DEFAULT_PIN="102569";let pinFails=0,pinLockUntil=0,pinMode="login";
async function sha(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))|0;return "d"+(h>>>0).toString(16)}}
async function pinRecord(){
  if(mode==="cloud"){try{const d=await db.doc("secure/admin").get();return d.exists?d.data():null}catch(e){return null}}
  try{return JSON.parse(localStorage.getItem("dr-admin-pin")||"null")}catch(e){return null}}
async function pinOk(pin){const r=await pinRecord();if(!r||!r.hash)return pin===DEFAULT_PIN;return (await sha(r.salt+":"+pin))===r.hash}
async function pinSave(pin){const salt=uid(),rec={hash:await sha(salt+":"+pin),salt,at:Date.now()};
  if(mode==="cloud")await db.doc("secure/admin").set(rec);else localStorage.setItem("dr-admin-pin",JSON.stringify(rec))}
const pinInput=(id,label)=>`<label class="f">${label}<input class="inp pin" id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></label>`;
function openPin(m){pinMode=m;$("#pinErr").textContent="";
  if(m==="login"){$("#pinTitle").textContent="เข้าสู่โหมดแอดมิน";$("#pinSub").textContent="ใส่รหัสผ่าน 6 หลัก";$("#pinFields").innerHTML=pinInput("pin1","รหัสผ่าน")}
  else{$("#pinTitle").textContent="เปลี่ยนรหัสแอดมิน";$("#pinSub").textContent="รหัสใหม่ใช้ได้ทุกเครื่องทันที";$("#pinFields").innerHTML=pinInput("pin0","รหัสปัจจุบัน")+pinInput("pin1","รหัสใหม่ 6 หลัก")+pinInput("pin2","ยืนยันรหัสใหม่")}
  $("#pinModal").classList.add("on");setTimeout(()=>$("#pinFields input").focus(),50)}
function closePin(){$("#pinModal").classList.remove("on");$("#pinFields").innerHTML=""}
async function submitPin(){
  const err=t=>$("#pinErr").textContent=t,v=id=>($("#"+id)||{}).value||"";
  if(Date.now()<pinLockUntil){err(`ใส่รหัสผิดหลายครั้ง รอ ${Math.ceil((pinLockUntil-Date.now())/1000)} วินาที`);return}
  const btn=$("#pinOk");btn.disabled=true;
  try{
    if(pinMode==="login"){
      if(!/^\d{6}$/.test(v("pin1"))){err("รหัสต้องเป็นตัวเลข 6 หลัก");return}
      if(await pinOk(v("pin1"))){pinFails=0;closePin();clientView=false;view="edit";setMode();render();window.scrollTo(0,0);toast("เข้าสู่โหมดแอดมินแล้ว")}
      else{pinFails++;if(pinFails>=5){pinLockUntil=Date.now()+60000;pinFails=0;err("ใส่รหัสผิด 5 ครั้ง ระบบล็อก 1 นาที")}else err(`รหัสไม่ถูกต้อง (เหลือ ${5-pinFails} ครั้ง)`);$("#pin1").value="";$("#pin1").focus()}
    }else{
      if(!(await pinOk(v("pin0")))){err("รหัสปัจจุบันไม่ถูกต้อง");return}
      if(!/^\d{6}$/.test(v("pin1"))){err("รหัสใหม่ต้องเป็นตัวเลข 6 หลัก");return}
      if(v("pin1")!==v("pin2")){err("รหัสใหม่ทั้งสองช่องไม่ตรงกัน");return}
      try{await pinSave(v("pin1"));closePin();toast("เปลี่ยนรหัสแอดมินแล้ว")}catch(e){err("บันทึกรหัสไม่สำเร็จ ("+errText(e)+")")}
    }
  }finally{btn.disabled=false}
}
$("#pinOk").onclick=submitPin;$("#pinCancel").onclick=closePin;
$("#pinModal").addEventListener("keydown",e=>{if(e.key==="Enter")submitPin();if(e.key==="Escape")closePin()});
const defShift=()=>{const h=new Date().getHours();return h>=8&&h<17?"day":"night"};
$("#hdrLogo").src=LOGO_DATA;
reports=localRead();loadDraft(inProject(today())?today():lastDay(),defShift());view="overview";render();setMode();
(async function(){
  if(!window.claude||!window.claude.use){return}
  const [d,a,dl,u]=await Promise.all(["db","assets","downloads","user"].map(n=>window.claude.use(n).catch(()=>null)));
  downloads=dl;user=u;
  if(!d){setMode();render();return}
  db=d;assets=a;mode="cloud";reports={};
  try{const c=await db.doc("config/blob").get();if(c.exists&&c.data().base){sharedBase=c.data().base;refreshLogo()}}catch(e){}
  if(assets){assets.list().then(l=>{(l.assets||[]).forEach(x=>learnBase(x.id,x.url));if(view!=="edit"||!dirty)render();refreshLogo()}).catch(()=>{})}
  try{const w=u&&await u.can("data.write");canWrite=w!==false;if(w==null&&u&&u.isOwner)canWrite=true}catch(e){}
  view="overview";clientView=true;setMode();render();
  db.collection("reports").orderBy("date","desc").limit(1000).onSnapshot(snap=>{
    const next={};snap.docs.forEach(doc=>{const v=doc.data();if(v&&v.date)next[doc.id]=v});reports=next;
    if(!dirty)loadDraft(draft.date,draft.shift);
    if(view==="edit"&&dirty)return;render();
  },()=>toast("การเชื่อมต่อข้อมูลขาดหาย รีเฟรชหน้าเพื่อเชื่อมใหม่"));
})();
})();
